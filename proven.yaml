special_reviewer: deepseek-v4.1-flash
families: claude-*=Anthropic, gpt-*=OpenAI, codex-*=OpenAI, nemotron-*=NVIDIA, qwen*=Alibaba, NVIDIA=NVIDIA, glm-*=Zhipu, deepseek-*=DeepSeek
doubled_classes: security
