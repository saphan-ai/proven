# Proven reviews its own pull requests (docs/ACTION.md).
# pull_request, never pull_request_target: a pull request from a fork runs with
# no secrets and a read-only token, so this job is skipped for one.
name: proven

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Action at main e5ea6e8: its image is saphan/proven:judging (docs/JUDGING.md).
      - uses: saphan-ai/proven@e5ea6e8f45d2a80b1a5056ab840aed9013cdec20 # main, Action on :judging
        with:
          strict: false
          comment: true
        env:
          # The reviewer: GLM-5.3 on Alibaba Cloud Model Studio (QwenCloud), called directly,
          # outside Nightshift (owner, 27 Oct: GLM-5.3 is the default reviewer). It is an
          # OpenAI-compatible API, so the generator's nightshift mode reaches it by its base URL.
          PROVEN_GENERATOR_MODE: nightshift
          PROVEN_GENERATOR_BASE_URL: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
          PROVEN_GENERATOR_MODEL: glm-5.3
          PROVEN_SKEPTIC_MODEL: glm-5.3
          PROVEN_GENERATOR_REQUIRE_NVIDIA: none
          # GLM-5.3 always thinks on this endpoint (enable_thinking=false is refused, HTTP 400), so
          # one call takes about 25 s on a short prompt; the limit leaves room for a long one.
          PROVEN_GENERATOR_TIMEOUT: 300s
          # The Planner reads a long change in bounded steps, each one diff hunk with a little
          # context, so no single call carries a whole large file (a two-file pull request was
          # one 43,654-token prompt when the steps were whole files).
          PROVEN_MARKOVIAN_STEP_UNIT: hunk
          METERLESS_RUNTIME_TOKEN: ${{ secrets.BAILIAN_TOKEN_PLAN_API_KEY }}
          # The security reviewer: another model family on the same endpoint, so a security change
          # is judged by two families (doubled_classes: security in proven.yaml).
          PROVEN_SECOND_REVIEWER_BASE_URL: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
          PROVEN_SECOND_REVIEWER_MODEL: qwen3.8-max
          PROVEN_SECOND_REVIEWER_KEY: ${{ secrets.BAILIAN_TOKEN_PLAN_API_KEY }}
          # The guardrail stays NVIDIA's content-safety model on every prompt and answer.
          PROVEN_GUARDRAIL_MODE: nvidia
          PROVEN_GUARDRAIL_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # NVIDIA's hosted guardrail took 4 s on a long prompt and timed out at the 5 s default.
          PROVEN_GUARDRAIL_TIMEOUT: 60s
