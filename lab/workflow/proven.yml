# The workflow a GitHub user commits, and the workflow the lab seeds.
# The lab's Gitea runs no GitHub Action, so this job runs the CLI itself in Proven's image and posts the text as ONE
# comment per pull request, edited in place on every run. GitHub users can use the Action instead (docs/ACTION.md).
# See docs/LAB.md.
# The sample set is chosen by the branch: a branch named demo-<name> is reviewed with the
# fixture <name> (lab/seed/prs.tsv); any other branch is reviewed with the discount fixture.
# The review is a SAMPLE review unless the repository holds a key (docs/LAB.md, "Go live"): `make up` stores each
# non-empty key of lab/.env as an Actions secret, and then the job runs a LIVE review. The first visible line of the
# comment says which: "sample: no keys" or "live: <generator>, Zetaris on|off".
# proven-image: saphan/proven:judging

name: proven

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per head commit. Gitea can start more than one run for one push (round 4 was told of two on one sha in
# a live lab; this file does not claim to know which event fired twice). Three guards, each for a different case:
#   - only the pull_request event starts this workflow (there is no push trigger), and its types are named;
#   - runs of one head commit queue behind each other (honoured by a Gitea that supports `concurrency`; one that
#     does not ignores the key, and the next guard carries it);
#   - a run that finds its head commit already reviewed posts nothing and says so (the two steps below).
concurrency:
  group: proven-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

# Every step is POSIX sh: the lab's job image (docker:cli, Alpine) has no bash,
# and act runs a step with bash unless the workflow names a shell.
defaults:
  run:
    shell: sh

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Run the review
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PROVEN_TOKEN: ${{ secrets.PROVEN_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROVEN_MARKOVIAN: ${{ secrets.PROVEN_MARKOVIAN }}
          PROVEN_LAB_SCOUT_INTENT: ${{ secrets.PROVEN_LAB_SCOUT_INTENT }}
          PROVEN_GENERATOR_MODE: ${{ secrets.PROVEN_GENERATOR_MODE }}
          PROVEN_GENERATOR_KEY: ${{ secrets.PROVEN_GENERATOR_KEY }}
          PROVEN_NVIDIA_BASE_URL: ${{ secrets.PROVEN_NVIDIA_BASE_URL }}
          PROVEN_GUARDRAIL_MODE: ${{ secrets.PROVEN_GUARDRAIL_MODE }}
          PROVEN_GUARDRAIL_KEY: ${{ secrets.PROVEN_GUARDRAIL_KEY }}
          PROVEN_GENERATOR_BASE_URL: ${{ secrets.PROVEN_GENERATOR_BASE_URL }}
          METERLESS_RUNTIME_TOKEN: ${{ secrets.METERLESS_RUNTIME_TOKEN }}
          ZETARIS_REST_URL: ${{ secrets.ZETARIS_REST_URL }}
          ZETARIS_API_KEY: ${{ secrets.ZETARIS_API_KEY }}
          ZETARIS_ORG_ID: ${{ secrets.ZETARIS_ORG_ID }}
          JUDGES_GATEWAY_URL: ${{ secrets.JUDGES_GATEWAY_URL }}
          JUDGES_GATEWAY_TOKEN: ${{ secrets.JUDGES_GATEWAY_TOKEN }}
          JUDGES_GATEWAY_ACCESS_TOKEN: ${{ secrets.JUDGES_GATEWAY_ACCESS_TOKEN }}
          PROVEN_GENERATOR_MODEL: ${{ secrets.PROVEN_GENERATOR_MODEL }}
          PROVEN_GENERATOR_REQUIRE_NVIDIA: ${{ secrets.PROVEN_GENERATOR_REQUIRE_NVIDIA }}
          GATEWAY_ZETARIS_PATH: /zetaris/api/v1.0
          GATEWAY_ZETARIS_ORG_ID: "0"
        run: |
          rm -f skip.txt
          # Already reviewed? A comment of Proven for this head commit means another run did the work.
          seen_token="${PROVEN_TOKEN:-$GH_TOKEN}"
          if [ -n "$seen_token" ] && [ -n "$API_URL" ] && [ -n "$HEAD_SHA" ]; then
            if wget -q -O seen.json --header="Authorization: token $seen_token" "$API_URL/repos/$REPO/issues/$PR/comments?limit=100" 2>/dev/null && grep -q "proven-review run=[0-9]* sha=$HEAD_SHA" seen.json; then
              echo "skipped: head commit $HEAD_SHA already has a Proven review; this run reviews nothing and posts nothing"
              echo skipped > skip.txt
              exit 0
            fi
          fi
          fixture=discount
          case "$HEAD_REF" in
            demo-*) fixture="${HEAD_REF#demo-}" ;;
          esac
          # What the stored keys say. The values stay in this step's environment and reach the container by NAME
          # (-e NAME), so none is on a command line, in a file or in the log.
          # derive-begin: lab/scripts/livecheck.sh runs the lines down to derive-end, so `make livecheck` judges readiness
          # with exactly the settings this job will use. They read the stored secrets by name and set sample, state, who.
          sample=true
          state="sample: no keys"
          gateway_cred="$JUDGES_GATEWAY_TOKEN"
          gateway_how=""
          if [ -z "$gateway_cred" ] && [ -n "$JUDGES_GATEWAY_ACCESS_TOKEN" ]; then
            gateway_cred="$JUDGES_GATEWAY_ACCESS_TOKEN"
            gateway_how=" (Access sign-in)"
          fi
          if [ -n "$JUDGES_GATEWAY_URL" ] && [ -n "$gateway_cred" ]; then
            # Path B: the judges' gateway holds our Nightshift token and Zetaris key; the judge's own token opens it.
            # With an Access sign-in the credential is the application token Cloudflare Access issued. The gateway reads it as
            # the cf-access-token header; it is also given to the job as the Bearer value and by name as JUDGES_GATEWAY_ACCESS_TOKEN.
            sample=false
            export PROVEN_GENERATOR_MODE=nightshift
            export PROVEN_GENERATOR_BASE_URL="${JUDGES_GATEWAY_URL%/}"
            export METERLESS_RUNTIME_TOKEN="$gateway_cred"
            export ZETARIS_REST_URL="${JUDGES_GATEWAY_URL%/}$GATEWAY_ZETARIS_PATH"
            export ZETARIS_API_KEY="$gateway_cred"
            export ZETARIS_ORG_ID="$GATEWAY_ZETARIS_ORG_ID"
            who="NVIDIA via the judges' gateway$gateway_how"
          elif [ -n "$METERLESS_RUNTIME_TOKEN" ]; then
            sample=false
            export PROVEN_GENERATOR_MODE=nightshift
            who="NVIDIA via Nightshift"
          elif [ -n "$PROVEN_GENERATOR_KEY" ]; then
            # Path A: one NVIDIA key is enough. It serves the guardrail too unless a guardrail key is stored.
            sample=false
            export PROVEN_GENERATOR_MODE=nvidia
            export PROVEN_GUARDRAIL_MODE=nvidia
            if [ -z "$PROVEN_GUARDRAIL_KEY" ]; then
              export PROVEN_GUARDRAIL_KEY="$PROVEN_GENERATOR_KEY"
            fi
            who="NVIDIA direct"
          fi
          # A guardrail key with no mode means NVIDIA's hosted guardrail. With no key the default (your own model
          # server) stays, and a review that cannot reach it names the guardrail as the failed service.
          if [ "$sample" = false ] && [ -z "$PROVEN_GUARDRAIL_MODE" ] && [ -n "$PROVEN_GUARDRAIL_KEY" ]; then
            export PROVEN_GUARDRAIL_MODE=nvidia
          fi
          if [ "$sample" = false ]; then
            zetaris=off
            if [ -n "$ZETARIS_REST_URL" ] && [ -n "$ZETARIS_API_KEY" ] && [ -n "$ZETARIS_ORG_ID" ]; then
              zetaris=on
            fi
            state="live: $who, Zetaris $zetaris"
          fi
          # derive-end
          printf '%s\n' "$state" > mode.txt
          live_env=""
          for name in PROVEN_GENERATOR_MODE PROVEN_GENERATOR_KEY PROVEN_NVIDIA_BASE_URL PROVEN_GUARDRAIL_MODE PROVEN_GUARDRAIL_KEY PROVEN_GENERATOR_BASE_URL METERLESS_RUNTIME_TOKEN ZETARIS_REST_URL ZETARIS_API_KEY ZETARIS_ORG_ID PROVEN_GENERATOR_MODEL PROVEN_GENERATOR_REQUIRE_NVIDIA JUDGES_GATEWAY_ACCESS_TOKEN; do
            eval "value=\${$name:-}"
            if [ -n "$value" ] && [ "$sample" = false ]; then
              live_env="$live_env -e $name"
            fi
          done
          # Markovian rides in sample mode too, so the page's "as this lab passed them" holds in both modes.
          if [ -n "${PROVEN_MARKOVIAN:-}" ]; then
            live_env="$live_env -e PROVEN_MARKOVIAN"
          fi
          # The Meterless features. Each answer is Proven's own setting, passed through and never defaulted here: an unset
          # one is not passed, and Proven's own default stands. PROVEN_MARKOVIAN is an environment setting (it rides in
          # live_env above; Proven reads it in live reviews only). Scout Intent is a key of proven.yaml (scout_intent) with
          # no environment spelling, so it is written to a file that the review is pointed at by PROVEN_CONFIG.
          # H-MEM and the World Model have no switch in Proven yet, so nothing is passed for them.
          case "$PROVEN_LAB_SCOUT_INTENT" in
            "" | on | off) ;;
            *)
              echo "PROVEN_LAB_SCOUT_INTENT=$PROVEN_LAB_SCOUT_INTENT is not on or off" >&2
              exit 1
              ;;
          esac
          docker run --rm $live_env -e SAMPLE_MODE="$sample" -e FIXTURE="$fixture" -e SCOUT_INTENT="$PROVEN_LAB_SCOUT_INTENT" --entrypoint sh saphan/proven:judging -c 'mkdir -p /tmp/proven-run && cd /tmp/proven-run && d="/opt/proven/fixture/$FIXTURE" && { [ -d "$d" ] || d=/opt/proven/fixture/discount; } && if [ -n "$SCOUT_INTENT" ]; then printf "scout_intent: %s\n" "$SCOUT_INTENT" > /tmp/proven-run/proven.yaml && export PROVEN_CONFIG=/tmp/proven-run/proven.yaml; fi && proven scan --md --text-output /tmp/proven-run/review.txt "$d" > /tmp/proven-run/review.md && cat /tmp/proven-run/review.txt && echo "----- proven: markdown -----" && cat /tmp/proven-run/review.md' > review.all
          # One review, two forms: the text the checks below read, and the Markdown the comment carries (the one a person
          # reads, and the lab's report page renders).
          sed '/^----- proven: markdown -----$/,$d' review.all > review.txt
          sed '1,/^----- proven: markdown -----$/d' review.all > review.md
          grep -q '^review class' review.txt
          grep -q 'Proven: ' review.md

      - name: Post the review on the pull request
        env:
          PROVEN_TOKEN: ${{ secrets.PROVEN_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -f skip.txt ]; then
            echo "skipped: this head commit was reviewed by another run"
            exit 0
          fi
          token="$PROVEN_TOKEN"
          if [ -z "$token" ]; then
            token="$GH_TOKEN"
          fi
          if [ -z "$token" ]; then
            echo "no token to post the review" >&2
            exit 1
          fi
          # Look again just before posting: a run that started at the same moment may have posted since the first look.
          if wget -q -O seen.json --header="Authorization: token $token" "$API_URL/repos/$REPO/issues/$PR/comments?limit=100" 2>/dev/null && grep -q "proven-review run=[0-9]* sha=$HEAD_SHA" seen.json; then
            echo "skipped: head commit $HEAD_SHA already has a Proven review"
            exit 0
          fi
          {
            printf '<!-- proven-review run=%s sha=%s -->\n' "$RUN_NUMBER" "$HEAD_SHA"
            # The first visible line says how the review was made: sample, or live and with what. The marker above
            # is an HTML comment and stays the first line of the body, which lab/scripts/e2e-parse.sh reads.
            cat mode.txt
            printf '\n'
            # A review that keeps no finding says so in one line, so a clean change is not a silent one. The
            # lines of the review below it are what was checked and by whom; "failed services: none" means
            # every check ran.
            # No finding while a service failed is not clean: the check that failed may be the one that would have found it.
            if ! grep -q '^finding ' review.txt; then
              if grep -q '^failed service: ' review.txt; then
                printf 'incomplete: Proven kept no finding, but a service failed (listed below), so this change was not fully reviewed.\n\n'
              else
                printf 'clean: Proven kept no finding on this change. The reviewers, the checks and the failed services are listed below.\n\n'
              fi
            fi
            cat review.md
          } > comment.txt
          # The poster below writes the marker line itself, so it is given the comment without it.
          tail -n +2 comment.txt > body.txt
          # One comment per pull request: find the one this account wrote, edit it, else create it.
          # The next lines are a verbatim copy of action/post-comment.sh; lab/scripts/post-comment-check.sh
          # fails when the two differ. A workflow in the user's repository cannot read that file.
          # post-comment: begin
          # pc_find_comment JSON ACCOUNT — print the id of the first comment in a page of
          # comments whose author is ACCOUNT and whose body starts with `<!-- proven-review`;
          # print nothing when there is none. The author is read from the comment's own "user"
          # object and the id from its first "id", so it holds for Gitea (user before body) and
          # GitHub (body before user). A body is read only as far as its first characters.
          pc_find_comment() {
            printf '%s' "$1" | awk -v account="$2" '
              { buf = buf $0 }
              END {
                # Between two comments the text is `},{"`; inside a string a quote is always
                # written \", so the same characters there never match.
                gsub(/\}, *\{ *"/, "}\n{\"", buf)
                n = split(buf, objs, "\n")
                for (i = 1; i <= n; i++) {
                  obj = objs[i]
                  if (!match(obj, /"id" *: *[0-9]+/)) continue
                  id = substr(obj, RSTART, RLENGTH)
                  sub(/^"id" *: */, "", id)
                  if (!match(obj, /"body" *: *"/)) continue
                  head = substr(obj, RSTART + RLENGTH, 40)
                  if (index(head, "<!-- proven-review") != 1 && index(head, "\\u003c!-- proven-review") != 1) continue
                  if (!match(obj, /"user" *: *\{/)) continue
                  user = substr(obj, RSTART)
                  if (!match(user, /"login" *: *"[^"]*"/)) continue
                  login = substr(user, RSTART, RLENGTH)
                  sub(/^"login" *: *"/, "", login)
                  sub(/"$/, "", login)
                  if (login != account) continue
                  print id
                  exit
                }
              }'
          }

          # pc_json FILE — print FILE as the JSON object {"body": "..."} the comment routes take.
          pc_json() {
            awk '
              # swap S SEP WITH: S with every SEP replaced by the literal WITH. split, not gsub: what
              # a backslash means in a gsub replacement differs between awks (BusyBox kept one of two).
              function swap(s, sep, with,   n, i, part, out) {
                n = split(s, part, sep)
                out = part[1]
                for (i = 2; i <= n; i++) out = out with part[i]
                return out
              }
              BEGIN { printf "{\"body\":\"" }
              {
                line = swap($0, "[\\\\]", "\\\\")
                line = swap(line, "\"", "\\\"")
                line = swap(line, "\t", "\\t")
                gsub(/[\001-\010\013-\037]/, "", line)
                printf "%s\\n", line
              }
              END { printf "\"}" }
            ' "$1"
          }

          # pc_pick_client — choose the HTTP client once. PATCH needs curl or GNU wget: BusyBox
          # wget (the lab job image, Alpine docker:cli) has no --method. Without either, curl is
          # installed from Alpine's packages inside this job's own container, and the choice falls
          # back to BusyBox wget only when that fails; then GET and POST work and PATCH is refused.
          #
          # With PC_LOCAL set (PROVEN_NETWORK=local, ADR-0034) the only client is curl, run with
          # -q (no .curlrc) and --noproxy '*' (no proxy, whatever the environment says), so the
          # judged API address is its only route. Nothing is installed: `apk add` reaches Alpine's
          # package mirrors, a host no setting names. Without curl the comment is not posted.
          pc_pick_client() {
            if [ -n "${PC_LOCAL:-}" ]; then
              if command -v curl >/dev/null 2>&1; then PC_CLIENT=curl; else PC_CLIENT=none; fi
              return 0
            fi
            if command -v curl >/dev/null 2>&1; then PC_CLIENT=curl; return 0; fi
            if wget --help 2>&1 | grep -q -- '--method'; then PC_CLIENT=gnuwget; return 0; fi
            if command -v apk >/dev/null 2>&1 && apk add --no-cache curl >/dev/null 2>&1 && command -v curl >/dev/null 2>&1; then
              PC_CLIENT=curl
              return 0
            fi
            PC_CLIENT=busybox
          }

          # pc_curl ARGS... — curl, with no configuration file and no proxy when PC_LOCAL is set.
          pc_curl() {
            if [ -n "${PC_LOCAL:-}" ]; then curl -q --noproxy '*' "$@"; else curl "$@"; fi
          }

          # pc_http METHOD URL [BODY_FILE] — print the response; a non-2xx answer is a failure.
          pc_http() {
            # COMMENT_HTTP is the offline checks' stub client; in local mode it is ignored, so the
            # judged address is reached by curl as above and by nothing else.
            if [ -n "${COMMENT_HTTP:-}" ] && [ -z "${PC_LOCAL:-}" ]; then "$COMMENT_HTTP" "$@"; return; fi
            [ -n "${PC_CLIENT:-}" ] || pc_pick_client
            auth="Authorization: token $PC_TOKEN"
            case "$PC_CLIENT" in
              curl)
                if [ -n "${3:-}" ]; then
                  pc_curl -fsS -X "$1" -H "$auth" -H "Content-Type: application/json" -H "Accept: application/json" --data-binary "@$3" "$2"
                else
                  pc_curl -fsS -X "$1" -H "$auth" -H "Accept: application/json" "$2"
                fi
                ;;
              none)
                echo "proven: PROVEN_NETWORK=local posts the summary comment with curl only, and this image has none; install curl in the job image" >&2
                return 1
                ;;
              gnuwget)
                if [ -n "${3:-}" ]; then
                  wget -q -O - --method="$1" --header="$auth" --header="Content-Type: application/json" --body-file="$3" "$2"
                else
                  wget -q -O - --method="$1" --header="$auth" "$2"
                fi
                ;;
              *)
                case "$1" in
                  GET) wget -q -O - --header="$auth" "$2" ;;
                  POST) wget -q -O - --header="$auth" --header="Content-Type: application/json" --post-file="$3" "$2" ;;
                  *)
                    echo "proven: this image has no HTTP client that can $1 (BusyBox wget cannot); install curl or GNU wget in the job image" >&2
                    return 1
                    ;;
                esac
                ;;
            esac
          }

          # pc_account API_URL — print the login of the account the token acts as. A token that
          # may not read /user (GitHub's installation token) acts as github-actions[bot]; on Gitea
          # there is no such default, so the account must then be named in PROVEN_COMMENT_ACCOUNT.
          pc_account() {
            if [ -n "${PROVEN_COMMENT_ACCOUNT:-}" ]; then printf '%s\n' "$PROVEN_COMMENT_ACCOUNT"; return 0; fi
            me=$(pc_http GET "$1/user" 2>/dev/null | awk 'match($0, /"login" *: *"[^"]*"/) { s = substr($0, RSTART, RLENGTH); sub(/^"login" *: *"/, "", s); sub(/"$/, "", s); print s; exit }')
            if [ -n "$me" ]; then printf '%s\n' "$me"; return 0; fi
            if [ "${GITEA_ACTIONS:-}" = true ]; then
              echo "proven: the token cannot read $1/user, so the posting account is unknown; set PROVEN_COMMENT_ACCOUNT" >&2
              return 1
            fi
            printf '%s\n' 'github-actions[bot]'
          }

          # pc_post API_URL REPO PR RUN_NUMBER HEAD_SHA TOKEN MARKDOWN_FILE — find, then edit or create.
          pc_post() {
            PC_TOKEN=$6
            pc_dir=$(mktemp -d) || return 1
            pc_run "$@"
            pc_rc=$?
            rm -rf "$pc_dir"
            return "$pc_rc"
          }

          # pc_run — the steps of pc_post, with its arguments and $pc_dir for the files it writes.
          pc_run() {
            {
              printf '<!-- proven-review run=%s sha=%s -->\n' "$4" "$5"
              cat "$7"
            } >"$pc_dir/comment.md"
            pc_json "$pc_dir/comment.md" >"$pc_dir/comment.json"
            pc_me=$(pc_account "$1") || return 1
            pc_id=
            pc_page=1
            pc_prev=
            while [ -z "$pc_id" ]; do
              # WHY a refusal and not a POST when the walk is cut off: the comment may be on a page
              # not read yet, and a second Proven comment on the pull request is the defect this
              # poster exists to prevent. The client prints no headers, so the end of the list is
              # the first page with no comment in it (the same end a missing rel="next" announces).
              if [ "$pc_page" -gt "${PC_MAX_PAGES:-500}" ]; then
                echo "proven: the comments of $2 #$3 were not read to the end after ${PC_MAX_PAGES:-500} pages, so no Proven comment is created; set PC_MAX_PAGES higher or remove old comments" >&2
                return 1
              fi
              pc_list=$(pc_http GET "$1/repos/$2/issues/$3/comments?limit=50&per_page=50&page=$pc_page") || return 1
              case "$pc_list" in *'{'*) ;; *) break ;; esac
              if [ "$pc_list" = "$pc_prev" ]; then
                echo "proven: page $pc_page of the comments of $2 #$3 is the same as page $((pc_page - 1)), so the server ignores paging and the list cannot be read to the end; no Proven comment is created" >&2
                return 1
              fi
              pc_prev=$pc_list
              pc_id=$(pc_find_comment "$pc_list" "$pc_me")
              pc_page=$((pc_page + 1))
            done
            if [ -n "$pc_id" ]; then
              pc_out=$(pc_http PATCH "$1/repos/$2/issues/comments/$pc_id" "$pc_dir/comment.json") || return 1
              pc_verb="updated comment $pc_id"
            else
              pc_out=$(pc_http POST "$1/repos/$2/issues/$3/comments" "$pc_dir/comment.json") || return 1
              pc_verb="created a comment"
            fi
            case "$pc_out" in *'"id"'*) ;; *) echo "proven: the server's answer to the comment carries no id: $pc_out" >&2; return 1 ;; esac
            echo "proven: $pc_verb on $2 #$3 as $pc_me (run $4)"
          }
          # post-comment: end
          pc_post "$API_URL" "$REPO" "$PR" "$RUN_NUMBER" "$HEAD_SHA" "$token" body.txt
