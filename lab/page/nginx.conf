# The lab's start page. One page at /lab, nothing else. The image's own nginx.conf runs as a user that
# is not root and includes this file; the page is read from the lab's page volume, mounted read-only.
# The path here is LAB_PAGE_PATH in lab/versions.env; a test holds the two together.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  # The page shows the lab's password: it is never stored by a browser or a proxy.
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /lab {
    default_type text/html;
    alias /usr/share/nginx/html/lab.html;
  }

  location / {
    return 404;
  }
}
