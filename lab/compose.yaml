# Judges' lab. Every value comes from the environment (lab/versions.env).
# Every published port names 127.0.0.1 in its own line. No setting changes that.
# The runner talks to the dind service. It does not mount the host's Docker socket.
# SSH is off. The image's OpenSSH already holds :22, and Gitea's own server
# on that port exited the container (measured 2026-10-23). No SSH port is published.

name: ${COMPOSE_PROJECT_NAME}

services:
  gitea:
    image: gitea/gitea:${GITEA_VERSION}
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__server__DOMAIN: 127.0.0.1
      GITEA__server__ROOT_URL: http://127.0.0.1:${GITEA_HTTP_PORT}/
      GITEA__server__HTTP_PORT: ${GITEA_CONTAINER_HTTP_PORT}
      GITEA__server__DISABLE_SSH: "${GITEA_DISABLE_SSH}"
      GITEA__server__START_SSH_SERVER: "${GITEA_START_SSH_SERVER}"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      # A repository made through the API gets these units. The seed also
      # turns the Actions unit on by name, so a kept volume is repaired.
      GITEA__repository__DEFAULT_REPO_UNITS: "repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.packages,repo.actions"
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT}:${GITEA_CONTAINER_HTTP_PORT}"
    volumes:
      - gitea-data:/data
    networks:
      - lab

  dind:
    image: docker:${DOCKER_VERSION}-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:${DIND_PORT}
      - --host=unix:///var/run/docker.sock
      - --tls=false
    volumes:
      - dind-data:/var/lib/docker
    networks:
      - lab

  # Grafana's OpenTelemetry stack (ADR-0045). Proven sends its review here as
  # OTLP; Grafana shows it on the provisioned dashboard. Both ports bind to 127.0.0.1.
  lgtm:
    image: ${LGTM_IMAGE}:${LGTM_VERSION}
    environment:
      # Open on the dashboard, not on Grafana's empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /proven-dashboards/proven-review.json
      # No sign-in: the lab binds to 127.0.0.1. `make trace` also reads through this.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:${LGTM_GRAFANA_PORT}:${LGTM_GRAFANA_CONTAINER_PORT}"
      - "127.0.0.1:${LGTM_OTLP_PORT}:${LGTM_OTLP_CONTAINER_PORT}"
    volumes:
      - ./grafana/proven-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/proven.yaml:ro
      - ./grafana/dashboards:/proven-dashboards:ro
    networks:
      - lab

  runner:
    image: gitea/act_runner:${ACT_RUNNER_VERSION}
    environment:
      GITEA_INSTANCE_URL: http://${GITEA_INTERNAL_HOST}:${GITEA_CONTAINER_HTTP_PORT}
      GITEA_RUNNER_NAME: ${RUNNER_NAME}
      GITEA_RUNNER_LABELS: ${RUNNER_LABEL}:docker://docker:${DOCKER_VERSION}-cli
      DOCKER_HOST: tcp://${DIND_HOST}:${DIND_PORT}
      CONFIG_FILE: /config.yaml
    entrypoint: ["/bin/sh", "/start.sh"]
    volumes:
      - runner-data:/data
      - runner-reg:/reg:ro
      - ./runner/config.yaml:/config.yaml:ro
      - ./runner/start.sh:/start.sh:ro
    depends_on:
      - gitea
      - dind
    restart: on-failure
    networks:
      - lab

  # The lab's start page: one static page at ${LAB_PAGE_PATH}, rendered by the seed into the lab-page volume.
  # The image runs as a user that is not root, so the container needs no capability, and its filesystem is
  # read-only apart from /tmp. The port names 127.0.0.1 in its own line, like every other port here: the page
  # carries the lab's password, and no setting moves it.
  page:
    image: ${LAB_PAGE_IMAGE}:${LAB_PAGE_IMAGE_VERSION}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${LAB_PAGE_PORT}:${LAB_PAGE_CONTAINER_PORT}"
    volumes:
      - lab-page:/usr/share/nginx/html:ro
      - ./page/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lab

  # Proven's documentation site (docs-site/Dockerfile): a Node server as user 10001, on 127.0.0.1. make up builds it.
  docs:
    image: ${DOCS_IMAGE}:${DOCS_IMAGE_TAG}
    build:
      context: ..
      dockerfile: docs-site/Dockerfile
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE}
        NODE_IMAGE: ${NODE_IMAGE}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${LAB_DOCS_PORT}:${LAB_DOCS_CONTAINER_PORT}"
    networks:
      - lab

  seed:
    image: ${SEED_IMAGE}:${SEED_IMAGE_TAG}
    # The admin password is not here: the seed reads it from /state/password in seed-state.
    environment:
      GITEA_INTERNAL_URL: http://${GITEA_INTERNAL_HOST}:${GITEA_CONTAINER_HTTP_PORT}
      LAB_URL: http://127.0.0.1:${GITEA_HTTP_PORT}/
      LAB_GRAFANA_URL: http://127.0.0.1:${LGTM_GRAFANA_PORT}/d/${LGTM_DASHBOARD_UID}
      LAB_DOCS_URL: http://127.0.0.1:${LAB_DOCS_PORT}/
      LAB_PAGE_URL: http://127.0.0.1:${LAB_PAGE_PORT}${LAB_PAGE_PATH}
      # Which mode `make up` started in: sample, live via our gateway, or live on your own setup. The start page shows it.
      LAB_MODE: ${LAB_MODE:-sample}
      LAB_ADMIN_USER: ${LAB_ADMIN_USER}
      LAB_ADMIN_EMAIL: ${LAB_ADMIN_EMAIL}
      LAB_BOT_USER: ${LAB_BOT_USER}
      LAB_BOT_EMAIL: ${LAB_BOT_EMAIL}
      LAB_DEMO_REPO: ${LAB_DEMO_REPO}
      LAB_DEMO_BASE: ${LAB_DEMO_BASE}
      LAB_DEMO_HEAD: ${LAB_DEMO_HEAD}
      PROVEN_IMAGE: ${PROVEN_IMAGE}
      RUNNER_LABEL: ${RUNNER_LABEL}
      # ADR-0045: the seeded workflow exports its review to the lgtm service.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${LGTM_INTERNAL_HOST}:${LGTM_OTLP_CONTAINER_PORT}
      OTEL_SERVICE_NAME: ${LAB_OTEL_SERVICE_NAME}
      OTEL_METRIC_EXPORT_INTERVAL: ${LAB_OTEL_METRIC_EXPORT_INTERVAL}
      LAB_SPECIAL_REVIEWER: ${LAB_SPECIAL_REVIEWER:-}
      # Going live (ADR-0052). The names the seed stores as Actions secrets, and the settings that are not secret.
      LAB_LIVE_KEYS: ${LAB_LIVE_KEYS}
      JUDGES_GATEWAY_ZETARIS_PATH: ${JUDGES_GATEWAY_ZETARIS_PATH}
      JUDGES_GATEWAY_ZETARIS_ORG_ID: ${JUDGES_GATEWAY_ZETARIS_ORG_ID}
      # The values come from the environment of the `make up` that started this container, by NAME only: they are
      # not in this file, not in an image, and not in `docker compose config` unless you exported them yourself.
      # An empty or absent one is not stored. Keep this list equal to LAB_LIVE_KEYS (a test holds the two).
      PROVEN_GENERATOR_MODE:
      PROVEN_GENERATOR_KEY:
      PROVEN_NVIDIA_BASE_URL:
      PROVEN_GUARDRAIL_MODE:
      PROVEN_GUARDRAIL_KEY:
      PROVEN_GENERATOR_BASE_URL:
      METERLESS_RUNTIME_TOKEN:
      ZETARIS_REST_URL:
      ZETARIS_API_KEY:
      ZETARIS_ORG_ID:
      JUDGES_GATEWAY_URL:
      JUDGES_GATEWAY_TOKEN:
      JUDGES_GATEWAY_ACCESS_TOKEN:
      PROVEN_GENERATOR_MODEL:
    volumes:
      - seed-state:/state
      - runner-reg:/reg
      - lab-page:/page
      - ./workflow/proven.yml:/workflow/proven.yml:ro
      # The demo pull requests, the start page's template, and the sample sets the pull requests are made from.
      - ./seed/prs.tsv:/seed/prs.tsv:ro
      - ./page/lab.html.tmpl:/seed/lab.html.tmpl:ro
      - ../testdata/fixture:/fixtures:ro
    depends_on:
      - gitea
    networks:
      - lab

  # Zetaris on this machine, path C (`make up ZETARIS=local`). Only the profile `zetaris` starts it. It does one
  # thing: it registers the evidence definitions (lab/zetaris/evidence.sql) in the platform that
  # lab/scripts/zetaris.sh started, as the judge's own Zetaris administrator. The sponsor's platform itself is the
  # judge's bundle, run as its own compose project with lab/zetaris/override.yml (127.0.0.1 only, on the lab
  # network); its images are in the sponsor's registry behind the judge's own sign-in. The administrator key reaches
  # this container by name from the environment and is never stored. The seed image runs as the user `proven`.
  zetaris-register:
    image: ${SEED_IMAGE}:${SEED_IMAGE_TAG}
    profiles: ["zetaris"]
    user: "65534:65534"
    entrypoint: ["/bin/sh", "/zetaris/register.sh"]
    environment:
      ZETARIS_REGISTER_URL: http://${ZETARIS_LAB_ALIAS}:${ZETARIS_API_PORT}${ZETARIS_REST_PATH}
      ZETARIS_ORG_ID:
      ZETARIS_ADMIN_API_KEY:
      ZETARIS_PROVEN_USER:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./zetaris:/zetaris:ro
    networks:
      - lab

networks:
  lab:
    name: ${COMPOSE_PROJECT_NAME}_lab

volumes:
  gitea-data:
  dind-data:
  runner-data:
  runner-reg:
  seed-state:
  lab-page:
